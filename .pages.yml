# Configuration de l'espace d'administration (Pages CMS — https://pagescms.org)
# Ouvre https://app.pagescms.org, connecte-toi avec GitHub, choisis ce dépôt,
# et édite le contenu dans des formulaires. « Save » publie automatiquement.

media:
  input: public/uploads
  output: /uploads
  extensions: [jpg, jpeg, png, gif, svg, webp, avif, JPG, JPEG, PNG, GIF, WEBP, AVIF]

content:
  - name: settings
    label: Paramètres du site
    type: file
    path: content/settings.json
    fields:
      - { name: name, label: Nom du site, type: string }
      - { name: tagline, label: Sous-titre, type: string }
      - { name: description, label: Description (SEO / partage), type: text }
      - { name: contactEmail, label: Email de contact, type: string }
      - { name: heroPhoto, label: "Photo d'accueil (hero, à droite)", type: image }
      - name: social
        label: Réseaux sociaux
        type: object
        fields:
          - { name: youtube, label: YouTube (URL), type: string }
          - { name: instagram, label: Instagram (URL), type: string }
          - { name: tiktok, label: TikTok (URL), type: string }
          - { name: facebook, label: Facebook (URL), type: string }
      - name: youtube
        label: YouTube
        type: object
        fields:
          - { name: handle, label: "Identifiant (ex. @Jack_brnt)", type: string }
          - { name: channelUrl, label: URL de la chaîne, type: string }
          - { name: shortsUrl, label: URL des Shorts, type: string }
          - { name: videosUrl, label: URL des vidéos, type: string }

  - name: devotions
    label: Dévotionnels
    type: file
    path: content/devotions.json
    fields:
      - name: items
        label: Dévotionnels
        type: object
        list: true
        fields:
          - { name: theme, label: Thème, type: string }
          - { name: verseText, label: "Verset d'ouverture (rhéma)", type: text }
          - { name: verseReference, label: "Verset d'ouverture (référence)", type: string }
          - { name: punchline, label: "Punchline (carte à partager)", type: text }
          - { name: meditation, label: Méditation, type: text }
          - { name: declarationText, label: "Déclaration (texte)", type: string }
          - { name: declarationReference, label: "Déclaration (référence)", type: string }
          - { name: questions, label: Questions, type: string, list: true }

  - name: thoughts
    label: Pensées du jour
    type: file
    path: content/thoughts.json
    fields:
      - name: items
        label: Pensées
        type: object
        list: true
        fields:
          - { name: title, label: Titre, type: string }
          - { name: body, label: Texte, type: text }
          - { name: author, label: Auteur, type: string }

  - name: about
    label: Qui suis-je (présentation)
    type: file
    path: content/about.json
    fields:
      - { name: eyebrow, label: "Petit titre (ex. Qui suis-je)", type: string }
      - { name: title, label: "Nom", type: string }
      - { name: role, label: "Rôle (ex. Pasteur & fondateur)", type: string }
      - { name: photo, label: "Photo de présentation", type: image }
      - { name: paragraphs, label: "Paragraphes", type: text, list: true }
      - { name: points, label: "Points clés (puces)", type: string, list: true }

  - name: home
    label: Accueil — prédications à la une
    type: file
    path: content/home.json
    fields:
      - name: featuredPredications
        label: "Titres des 3 prédications mises en avant (recherche souple)"
        type: string
        list: true

  - name: shorts
    label: Shorts (vidéos courtes)
    type: file
    path: content/shorts.json
    fields:
      - name: items
        label: Shorts
        type: object
        list: true
        fields:
          - { name: id, label: "ID YouTube (partie après /shorts/)", type: string }
          - { name: title, label: Titre, type: string }
          - { name: category, label: "Catégorie (ex. Foi, Encouragement…)", type: string }

  - name: videos
    label: Prédications (formats longs)
    type: file
    path: content/videos.json
    fields:
      - name: items
        label: Vidéos
        type: object
        list: true
        fields:
          - { name: id, label: "ID YouTube (partie après watch?v=)", type: string }
          - { name: title, label: Titre, type: string }
          - { name: category, label: "Catégorie (ex. Foi, Enseignement…)", type: string }

  - name: verses
    label: Versets du jour
    type: file
    path: content/verses.json
    fields:
      - name: items
        label: Versets
        type: object
        list: true
        fields:
          - { name: reference, label: Référence, type: string }
          - { name: text, label: Texte du verset, type: text }
          - { name: version, label: Version (ex. LSG), type: string }

  - name: reading-plan
    label: Plan de lecture
    type: file
    path: content/reading-plan.json
    fields:
      - name: items
        label: Jours
        type: object
        list: true
        fields:
          - { name: day, label: Jour n°, type: number }
          - { name: theme, label: Thème, type: string }
          - { name: passages, label: Passages, type: string, list: true }
          - { name: minutes, label: Durée (minutes), type: number }

  - name: testimonies
    label: Témoignages
    type: file
    path: content/testimonies.json
    fields:
      - name: items
        label: Témoignages
        type: object
        list: true
        fields:
          - { name: name, label: Prénom / nom, type: string }
          - { name: location, label: Ville, type: string }
          - { name: quote, label: Témoignage, type: text }

  - name: products
    label: Boutique
    type: file
    path: content/products.json
    fields:
      - name: items
        label: Produits
        type: object
        list: true
        fields:
          - { name: title, label: Titre, type: string }
          - { name: type, label: "Type (ex. Livre · à méditer chaque jour)", type: string }
          - { name: image, label: "Photo du produit", type: image }
          - { name: price, label: "Prix (ex. 19 €) — si disponible", type: string }
          - { name: badge, label: "Badge (ex. Bientôt disponible, Nouveau)", type: string }
          - { name: available, label: "Disponible à la vente ?", type: boolean }

  - name: support-tiers
    label: Niveaux de soutien
    type: file
    path: content/support-tiers.json
    fields:
      - name: items
        label: Niveaux
        type: object
        list: true
        fields:
          - { name: name, label: Nom du niveau, type: string }
          - { name: amount, label: Montant (ex. 20 €), type: string }
          - { name: cadence, label: "Cadence (ex. / mois)", type: string }
          - { name: description, label: Description, type: text }
          - { name: perks, label: Avantages, type: string, list: true }
          - { name: featured, label: Mettre en avant ?, type: boolean }

  - name: mission
    label: Mission Madagascar
    type: file
    path: content/mission.json
    fields:
      - { name: active, label: Mission active ?, type: boolean }
      - { name: title, label: Titre, type: string }
      - { name: period, label: "Période (ex. Début novembre · 10 jours)", type: string }
      - { name: location, label: Lieu, type: string }
      - { name: objectiveEur, label: "Objectif (en €)", type: number }
      - { name: raisedEur, label: "Montant collecté (en €)", type: number }

  - name: plans
    label: Plans de lecture
    type: file
    path: content/plans.json
    fields:
      - name: items
        label: Parcours
        type: object
        list: true
        fields:
          - { name: slug, label: "Identifiant URL (ex. peur) — sans espace ni accent", type: string }
          - { name: title, label: "Titre du plan", type: string }
          - { name: subtitle, label: "Sous-titre (une ligne, ex. 5 jours pour…)", type: string }
          - { name: summary, label: "Résumé accrocheur (2-3 phrases, façon Netflix)", type: text }
          - { name: cover, label: "Photo de couverture (format vertical)", type: image }
          - { name: author, label: "Nom de l'auteur", type: string }
          - { name: authorPhoto, label: "Photo de l'auteur (ronde)", type: image }
          - { name: authorRole, label: "Rôle de l'auteur (ex. Pasteur)", type: string }
          - { name: authorBio, label: "Bio de l'auteur (fiche présentée au clic)", type: text }
          - { name: authorInstagram, label: "Instagram de l'auteur (URL)", type: string }
          - name: authorResources
            label: "Ressources de l'auteur (boutons de la fiche)"
            type: object
            list: true
            fields:
              - { name: label, label: "Nom (ex. Podcast, YouTube, Boutique)", type: string }
              - { name: url, label: "Lien (URL ou /page interne)", type: string }
          - name: days
            label: Jours du parcours
            type: object
            list: true
            fields:
              - { name: day, label: Jour n°, type: number }
              - { name: title, label: "Titre du jour", type: string }
              - { name: verses, label: "Passages à lire (références, ex. Ésaïe 41:10)", type: string, list: true }
              - { name: meditation, label: "Méditation / exhortation", type: text }

  - name: events
    label: Actualité & agenda
    type: file
    path: content/events.json
    fields:
      - name: items
        label: Événements
        type: object
        list: true
        fields:
          - { name: type, label: "Type (live = en ligne, presentiel, annonce)", type: select, options: { values: [live, presentiel, annonce] } }
          - { name: title, label: Titre, type: string }
          - { name: date, label: "Date (AAAA-MM-JJ) — pour l'agenda", type: string }
          - { name: time, label: "Heure (ex. 20:30)", type: string }
          - { name: location, label: "Lieu (ex. En ligne · TikTok / Pau (64))", type: string }
          - { name: description, label: Description, type: text }
          - { name: link, label: "Lien (URL ou /page interne)", type: string }
          - { name: linkLabel, label: "Texte du bouton (ex. Rejoindre le live)", type: string }
          - { name: badge, label: "Badge (annonces : ex. Bientôt)", type: string }

  - name: music
    label: Musique soaking
    type: file
    path: content/music.json
    fields:
      - name: items
        label: Pistes
        type: object
        list: true
        fields:
          - { name: title, label: Titre, type: string }
          - { name: artist, label: Artiste, type: string }
          - { name: src, label: "Chemin du MP3 (ex. /music/piste.mp3)", type: string }

  - name: impact
    label: Impact & transparence
    type: file
    path: content/impact.json
    fields:
      - name: stats
        label: Statistiques d'impact
        type: object
        list: true
        fields:
          - { name: value, label: Valeur (ex. 120 000+), type: string }
          - { name: label, label: Légende, type: string }
      - name: fundUsage
        label: Utilisation des dons
        type: object
        list: true
        fields:
          - { name: label, label: Poste de dépense, type: string }
          - { name: percent, label: Pourcentage, type: number }
