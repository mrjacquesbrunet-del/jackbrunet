<style>
@font-face{font-family:Archivo;src:url(a/archivo-latin-wght-normal.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Playfair;src:url(a/playfair-display-latin-wght-normal.woff2) format('woff2');font-weight:400 900}
@font-face{font-family:Playfair;src:url(a/playfair-display-latin-wght-italic.woff2) format('woff2');font-weight:400 900;font-style:italic}
:root{--bg:#0A0B09;--cream:#F3F3ED;--creme:#EADFC6;--lime:#CAF000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:Archivo,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.layer{position:absolute;inset:0}
.glow{position:absolute;border-radius:50%;filter:blur(120px);will-change:transform}
.scene{position:absolute;inset:0;visibility:hidden}
.abs{position:absolute}
.m{display:inline-block;overflow:hidden;vertical-align:top;padding:.14em .04em .1em;margin:-.14em 0 -.1em}
.m>.i{display:inline-block;will-change:transform}
.kick{font-size:26px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--lime)}
.kick b{color:var(--cream);opacity:.45;font-weight:600;margin-right:18px}
.titre{font-family:Playfair;font-weight:700;font-size:100px;line-height:1.02;letter-spacing:-.01em;color:var(--cream)}
.titre em{font-style:italic;color:var(--lime);font-weight:600}
.sous{font-size:36px;line-height:1.4;color:rgba(243,243,237,.68);font-weight:400}
.chip{position:absolute;display:flex;align-items:center;gap:16px;padding:16px 26px 16px 16px;border-radius:999px;
  background:rgba(28,30,26,.72);border:1px solid rgba(234,223,198,.16);backdrop-filter:blur(14px);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.7);font-size:25px;font-weight:600;white-space:nowrap}
.chip .ic{width:54px;height:54px;border-radius:50%;background:var(--lime);display:grid;place-items:center;flex:none}
.chip .ic svg{width:28px;height:28px;stroke:#0A0B09}
.chip small{display:block;font-size:18px;font-weight:500;color:rgba(243,243,237,.55);margin-top:2px}
.feat{display:flex;align-items:center;gap:22px;font-size:33px;font-weight:600;margin-top:26px}
.feat .ic{width:60px;height:60px;border-radius:18px;border:1.5px solid rgba(202,240,0,.5);display:grid;place-items:center;flex:none;background:rgba(202,240,0,.06)}
.feat .ic svg{width:30px;height:30px;stroke:var(--lime)}
svg.s{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Téléphone */
.phone{position:absolute;width:404px;height:848px;border-radius:68px;padding:12px;
  background:linear-gradient(150deg,#4a4d47 0%,#191a17 22%,#0e0f0d 60%,#33352f 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14),inset 0 0 0 5px #0b0c0a,0 80px 140px -40px rgba(0,0,0,.95),0 0 120px -30px rgba(202,240,0,.18)}
.phone .scr{position:relative;width:380px;height:824px;border-radius:56px;overflow:hidden;background:#0c0c0a}
.phone .scr .c{position:absolute;left:0;top:40px;width:380px;display:block;will-change:transform}
.phone .scr .nav{position:absolute;left:0;bottom:0;width:380px;display:block;z-index:2}
.phone .sb{position:absolute;left:0;top:0;width:100%;height:42px;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 44px;font-size:16px;font-weight:700}
.phone .island{position:absolute;top:12px;left:50%;width:112px;height:32px;margin-left:-56px;background:#000;border-radius:20px;z-index:4}
.phone .bat{width:26px;height:12px;border-radius:4px;border:1.5px solid currentColor;position:relative;opacity:.9}
.phone .bat:after{content:'';position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1.5px}
.phone .shine{position:absolute;inset:0;border-radius:68px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 28%);z-index:5}
.carte{position:absolute;width:250px;height:250px;border-radius:28px;background-size:cover;background-position:center;box-shadow:0 40px 80px -20px rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.08)}
.tuile{position:absolute;width:250px;height:542px;border-radius:30px;background-size:cover;background-position:top center;box-shadow:0 30px 70px -20px rgba(0,0,0,.9);border:1px solid rgba(255,255,255,.07)}
#grain{position:absolute;inset:-200px;background:url(a/grain.png);opacity:.06;mix-blend-mode:overlay;pointer-events:none;z-index:50}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
#wipe{position:absolute;inset:0;background:var(--lime);z-index:40;transform:scaleX(0);transform-origin:right center}
#flash{position:absolute;inset:0;background:#fff;z-index:41;opacity:0}
.mot{position:absolute;left:0;right:0;text-align:center;font-weight:900;font-size:180px;letter-spacing:-.04em;line-height:1}
.mot .pt{color:var(--lime)}
.motsous{position:absolute;left:0;right:0;text-align:center;font-size:26px;font-weight:700;letter-spacing:.5em;text-transform:uppercase;color:rgba(243,243,237,.55)}
.anneau{position:absolute;left:540px;top:900px;width:800px;height:800px;margin:-400px 0 0 -400px;border-radius:50%;border:2px solid rgba(202,240,0,.35)}
.bulle{position:absolute;display:flex;align-items:center;gap:10px;padding:10px 20px 10px 12px;border-radius:999px;background:rgba(202,240,0,.12);border:1px solid rgba(202,240,0,.45);font-size:22px;font-weight:700;color:var(--lime)}
.bulle img{width:30px;height:30px;object-fit:contain}
.pill{display:inline-flex;align-items:center;gap:14px;padding:20px 34px;border-radius:999px;font-size:26px;font-weight:700;border:1.5px solid rgba(243,243,237,.25)}
.pill.l{background:var(--lime);color:#0A0B09;border-color:var(--lime)}
.pill svg{width:28px;height:28px}
.part{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--lime)}
.eq{position:absolute;display:flex;align-items:flex-end;gap:8px;height:120px}
.eq i{display:block;width:10px;border-radius:5px;background:var(--lime)}
</style>
</head>

const covers = ['rhema-du-jour', 'foi', 'saint-esprit', 'apprendre-a-prier', 'identite', 'les-7-je-suis-de-jesus', '40-jours-avec-jesus', 'annoncer-liberer-guerir'];
document.getElementById('orbite').innerHTML = covers.map((c, i) => `<div class="carte" id="cv${i}" style="background-image:url(a/c-${c}.jpg)"></div>`).join('');
/* Bulles « Je prie » */
document.getElementById('bulles').innerHTML = Array.from({ length: 9 }, (_, i) => `<div class="bulle" id="bu${i}"><img src="a/priere.png">${['Je prie', 'Amen', 'Je prie', 'Je prie pour toi', 'Amen', 'Je prie', 'Dieu est fidèle', 'Je prie', 'Amen'][i]}</div>`).join('');
/* Particules (repos) */
document.getElementById('parts').innerHTML = Array.from({ length: 60 }, (_, i) => `<div class="part" id="pa${i}"></div>`).join('');
/* Mur d'écrans */
const ecr = ['accueil', 'mur', 'podcasts', 'bible', 'plans', 'ecole', 'lexique', 'chronologie', 'personnages', 'soaking'];
let tu = '';
for (let r = 0; r < 6; r++) for (let c = 0; c < 8; c++) {
  const n = ecr[(r * 3 + c) % ecr.length];
  tu += `<div class="tuile" style="left:${c * 290 + (r % 2) * 145}px;top:${r * 590}px;background-image:url(a/${n}.jpg)"></div>`;
}
document.getElementById('plan').innerHTML = tu;

/* ———————— Timeline ———————— */
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
gsap.set('.phone', { xPercent: -50, yPercent: -50, transformPerspective: 2000 });
$$('.phone').forEach((p) => gsap.set(p, { left: +p.dataset.x, top: +p.dataset.y, scale: +p.dataset.s }));
gsap.set('.chip', { transformPerspective: 1200 });

gsap.set('#flash', { opacity: 0 });
const tl = gsap.timeline({ paused: true, defaults: { ease: 'expo.out' } });
const show = (id, a, b) => { tl.set(id, { visibility: 'visible' }, a); tl.set(id, { visibility: 'hidden' }, b); };
const inner = (sel) => $$(sel + ' .i');
const rev = (sel, at, o = {}) => tl.fromTo(inner(sel), { yPercent: 140, rotate: o.rot ?? 4 }, { yPercent: 0, rotate: 0, duration: o.d ?? .9, stagger: o.st ?? .07, ease: 'expo.out' }, at);
const out = (sel, at, o = {}) => tl.to(inner(sel), { yPercent: -140, duration: o.d ?? .45, stagger: o.st ?? .03, ease: 'expo.in' }, at);
const pop = (sel, at) => tl.fromTo(sel, { scale: .5, autoAlpha: 0, y: 30 }, { scale: 1, autoAlpha: 1, y: 0, duration: .8, ease: 'back.out(1.8)' }, at);
const wipe = (at) => {
  tl.fromTo('#wipe', { scaleX: 0, transformOrigin: 'right center' }, { scaleX: 1, duration: .32, ease: 'expo.in' }, at - .32);
  tl.set('#wipe', { transformOrigin: 'left center' }, at);
  tl.to('#wipe', { scaleX: 0, duration: .42, ease: 'expo.out' }, at);
};

/* S0 — intro (0 → 4) */
show('#s0', 0, 4);
tl.fromTo('#s0logo', { autoAlpha: 0, y: 40, scale: .85 }, { autoAlpha: 1, y: 0, scale: 1, duration: 1.4, ease: 'power3.out' }, .15);
tl.fromTo('#s0ligne', { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: 'expo.inOut' }, .5);
rev('#s0rhema', 1.0, { st: .08, d: 1.1, rot: 0 });
tl.fromTo('#s0tag', { autoAlpha: 0, y: 24, filter: 'blur(12px)' }, { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: 1.1, ease: 'power3.out' }, 1.9);
tl.to('#s0', { scale: 2.6, filter: 'blur(18px)', autoAlpha: 0, duration: .55, ease: 'expo.in' }, 3.45);

/* S1 — mots sur le temps (4 → 8) */
show('#s1', 3.9, 8.05);
['w0', 'w1', 'w2', 'w3'].forEach((w, i) => {
  const t = 4 + i;
  tl.fromTo(inner('#' + w), { yPercent: 140, skewY: 8 }, { yPercent: 0, skewY: 0, duration: .5, ease: 'expo.out' }, t);
  tl.fromTo(inner('#ws' + i), { yPercent: 140 }, { yPercent: 0, duration: .5, ease: 'expo.out' }, t + .08);
  tl.fromTo(i % 2 ? '#an2' : '#an1', { scale: .35, autoAlpha: .9 }, { scale: 1.6, autoAlpha: 0, duration: .95, ease: 'power2.out' }, t);
  if (i < 3) {
    tl.to(inner('#' + w), { yPercent: -140, duration: .3, ease: 'expo.in' }, t + .7);
    tl.to(inner('#ws' + i), { yPercent: -140, duration: .3, ease: 'expo.in' }, t + .7);
  }
});
tl.to('#w3', { scale: 1.08, duration: .9, ease: 'none' }, 7);
wipe(8.05);

/* S2 — accueil (8 → 14) */
show('#s2', 8.05, 14.2);
tl.fromTo('#pA', { y: 900, rotationX: 28, rotationY: -34, rotation: 8 }, { y: 0, rotationX: 6, rotationY: -16, rotation: 0, duration: 1.4, ease: 'expo.out' }, 8.1);
tl.to('#pA', { rotationY: -8, rotationX: 2, duration: 4.4, ease: 'sine.inOut' }, 9.5);
rev('#s2k', 8.3); rev('#s2t', 8.45, { st: .1 }); rev('#s2p', 9.0, { st: .02, d: .8 });
pop('#s2c1', 9.6); pop('#s2c2', 10.1);
tl.to('#pA .c', { y: -560, duration: 1.6, ease: 'power3.inOut' }, 10.6);
tl.to('#pA .c', { y: -1180, duration: 1.4, ease: 'power3.inOut' }, 12.2);
out('#s2k', 13.6); out('#s2t', 13.62); out('#s2p', 13.64, { st: .01 });
tl.to('#s2c1,#s2c2', { scale: .6, autoAlpha: 0, duration: .35, ease: 'expo.in' }, 13.6);
tl.to('#pA', { x: -1500, rotationY: 30, duration: .6, ease: 'expo.in' }, 13.6);

/* S3 — bible (14 → 20) */
show('#s3', 14, 20.1);
tl.fromTo('#pB', { x: 1100, rotationY: -40, rotation: -6 }, { x: 0, rotationY: -12, rotation: 0, duration: 1.3, ease: 'expo.out' }, 14.0);
tl.fromTo('#pC', { x: 900, rotationY: -40, autoAlpha: 0 }, { x: 0, rotationY: -22, autoAlpha: .55, duration: 1.4, ease: 'expo.out' }, 14.2);
tl.fromTo('#pB .c', { y: 0 }, { y: -2900, duration: 5.2, ease: 'power1.inOut' }, 14.6);
tl.to('#pB', { rotationY: -6, duration: 5, ease: 'sine.inOut' }, 15);
rev('#s3k', 14.25); rev('#s3t', 14.4, { st: .1 });
$$('#s3f .feat').forEach((f, i) => tl.fromTo(f.querySelector('.i'), { yPercent: 115 }, { yPercent: 0, duration: .7 }, 15.5 + i * .5));
out('#s3k', 19.6); out('#s3t', 19.62); out('#s3f', 19.64);
tl.to('#pB,#pC', { y: -2100, rotationX: 30, duration: .6, ease: 'expo.in', stagger: .04 }, 19.55);

/* S4 — podcasts (20 → 26) */
show('#s4', 20.05, 26.1);
tl.fromTo('#pD', { y: 1000, rotationX: -30, rotation: -6 }, { y: 0, rotationX: 0, rotation: 0, duration: 1.3 }, 20.05);
tl.to('#pD', { rotationY: 10, duration: 5, ease: 'sine.inOut' }, 21);
tl.fromTo('#orbite', { autoAlpha: 0, scale: .7 }, { autoAlpha: 1, scale: 1, duration: 1.4, ease: 'power3.out' }, 20.3);
rev('#s4k', 20.35); rev('#s4t', 20.5, { st: .12 }); rev('#s4p', 21.0, { st: .02, d: .8 });
pop('#s4c1', 21.6); pop('#s4c2', 22.1);
tl.fromTo('#eq', { autoAlpha: 0 }, { autoAlpha: 1, duration: .6 }, 22.4);
tl.to('#pD .c', { y: -900, duration: 1.8, ease: 'power3.inOut' }, 22.8);
out('#s4k', 25.6); out('#s4t', 25.62); out('#s4p', 25.64, { st: .01 });
tl.to('#s4c1,#s4c2,#eq', { autoAlpha: 0, scale: .7, duration: .35, ease: 'expo.in' }, 25.6);
tl.to('#pD', { y: -2000, rotationX: 25, duration: .55, ease: 'expo.in' }, 25.55);
tl.to('#orbite', { scale: 1.6, autoAlpha: 0, duration: .55, ease: 'expo.in' }, 25.55);

/* S5 — mur de prière (26 → 32) */
show('#s5', 26.05, 32.1);
tl.fromTo('#pE', { x: -1000, rotationY: 45, rotation: 6 }, { x: 0, rotationY: 14, rotation: 0, duration: 1.3 }, 26.05);
tl.to('#pE', { rotationY: 6, duration: 5, ease: 'sine.inOut' }, 27.2);
rev('#s5k', 26.35); rev('#s5t', 26.5, { st: .12 }); rev('#s5p', 27.0, { st: .02, d: .8 });
pop('#s5c1', 27.6);
const cpt = { v: 120 };
tl.to(cpt, { v: 132, duration: 2.6, ease: 'power1.out', onUpdate: () => { $('#cpt').textContent = Math.round(cpt.v); } }, 27.9);
tl.to('#pE .c', { y: -820, duration: 1.8, ease: 'power3.inOut' }, 28.2);
tl.to('#pE .c', { y: -1650, duration: 1.6, ease: 'power3.inOut' }, 30.0);
out('#s5k', 31.6); out('#s5t', 31.62); out('#s5p', 31.64, { st: .01 });
tl.to('#s5c1', { autoAlpha: 0, scale: .7, duration: .35, ease: 'expo.in' }, 31.6);
tl.to('#pE', { x: -1300, rotationY: 40, duration: .55, ease: 'expo.in' }, 31.55);
wipe(32.1);

/* S6 — grandir (32 → 37) */
show('#s6', 32.1, 37.1);
rev('#s6k', 32.2); rev('#s6t', 32.3, { st: .1 });
tl.fromTo('#pF', { y: 1000, rotationY: 30, rotation: -8 }, { y: 0, rotationY: 18, rotation: -3, duration: 1.2 }, 32.35);
tl.fromTo('#pG', { y: 1000 }, { y: 0, duration: 1.2 }, 32.6);
tl.fromTo('#pH', { y: 1000, rotationY: -30, rotation: 8 }, { y: 0, rotationY: -18, rotation: 3, duration: 1.2 }, 32.85);
tl.to('#pF', { x: -40, duration: 3.6, ease: 'none' }, 33.5);
tl.to('#pH', { x: 40, duration: 3.6, ease: 'none' }, 33.5);
tl.to('#pG', { scale: .95, duration: 3.6, ease: 'none' }, 33.5);
tl.to('#pG .c', { y: -520, duration: 1.6, ease: 'power3.inOut' }, 34.6);
out('#s6k', 36.6); out('#s6t', 36.62);
tl.to('#pF,#pG,#pH', { y: 1100, duration: .55, ease: 'expo.in', stagger: .05 }, 36.5);

/* S7 — repos (37 → 41) */
show('#s7', 37.1, 41.1);
tl.fromTo('#s7t .i', { yPercent: 0, autoAlpha: 0, filter: 'blur(14px)', y: 20 }, { autoAlpha: 1, filter: 'blur(0px)', y: 0, duration: 1.2, stagger: .09, ease: 'power3.out' }, 37.2);
tl.fromTo('#s7c', { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 1, ease: 'power3.out' }, 38.5);
tl.fromTo('#s7in', { scale: 1 }, { scale: 1.06, duration: 4, ease: 'none' }, 37.1);
tl.to('#s7in', { autoAlpha: 0, filter: 'blur(16px)', duration: .45, ease: 'power2.in' }, 40.6);
tl.to('#flash', { opacity: .85, duration: .12, ease: 'none' }, 40.98);
tl.to('#flash', { opacity: 0, duration: .5, ease: 'power2.out' }, 41.1);

/* S8 — mur d'écrans (41 → 46) */
show('#s8', 41.05, 46.1);
tl.fromTo('#plan', { rotationX: 38, rotation: -14, scale: 1.05, x: 260, y: 220, transformPerspective: 2400 }, { x: -260, y: -120, scale: .92, duration: 5, ease: 'none' }, 41.05);
tl.fromTo('#s8bande', { autoAlpha: 0 }, { autoAlpha: 1, duration: .6, ease: 'power2.out' }, 41.4);
rev('#s8t', 41.5, { st: .12 });
rev('#s8l', 42.3, { st: .05 });
gsap.set(['#lg1', '#lg2'], { yPercent: 140 });
['lg0', 'lg1', 'lg2'].forEach((l, i) => {
  if (i > 0) tl.fromTo('#' + l, { yPercent: 140 }, { yPercent: 0, duration: .45, immediateRender: false }, 42.9 + i * .7);
  if (i < 2) tl.to('#' + l, { yPercent: -140, duration: .3, ease: 'expo.in' }, 42.9 + (i + 1) * .7 - .3);
});
tl.fromTo('#lg0', { yPercent: 140 }, { yPercent: 0, duration: .5 }, 42.45);
tl.to('#s8', { scale: 1.8, autoAlpha: 0, filter: 'blur(14px)', duration: .55, ease: 'expo.in' }, 45.5);

/* S9 — fin (46 → 50) */
show('#s9', 46, 50.5);
tl.set('#flash', { opacity: .7 }, 46);
tl.to('#flash', { opacity: 0, duration: .7, ease: 'power2.out' }, 46.02);
tl.fromTo('#s9logo', { autoAlpha: 0, scale: .6, y: 30 }, { autoAlpha: 1, scale: 1, y: 0, duration: 1.2, ease: 'back.out(1.6)' }, 46.05);
rev('#s9r', 46.15, { st: .07, rot: 0 });
tl.fromTo('#s9tag', { autoAlpha: 0, y: 20, filter: 'blur(10px)' }, { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: 1 }, 46.7);
tl.fromTo('#s9b1', { autoAlpha: 0, scale: .6 }, { autoAlpha: 1, scale: 1, duration: .9, ease: 'back.out(2)' }, 47.1);
tl.fromTo('#s9s', { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: .9, ease: 'power3.out' }, 47.4);
tl.to('#s9', { autoAlpha: 0, duration: 1, ease: 'power2.in' }, 49.2);
tl.set({}, {}, 50.4);

const DUREE = 50.4;
/* ———————— Ambiance (déterministe : fonction du temps) ———————— */
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function ambiance(t) {
  gsap.set('#grain', { x: Math.floor(rnd(Math.floor(t * 24)) * 200) - 100, y: Math.floor(rnd(Math.floor(t * 24) + 7) * 200) - 100 });
  gsap.set('#g1', { x: Math.sin(t * .35) * 220, y: Math.cos(t * .28) * 140 });
  gsap.set('#g2', { x: Math.cos(t * .3) * 260, y: Math.sin(t * .22) * 160 });
  gsap.set('#g3', { x: Math.sin(t * .5 + 1) * 300, y: Math.cos(t * .4) * 200, scale: 1 + .2 * Math.sin(t * 1.0) });
  // Puces qui flottent
  $$('.chip').forEach((c, i) => { gsap.set(c.firstElementChild, { y: Math.sin(t * 1.6 + i * 1.3) * 6 }); });
  // Orbite des pochettes
  if (t > 19.5 && t < 26.5) covers.forEach((_, i) => {
    const a = (i / covers.length) * Math.PI * 2 + t * .42;
    const z = Math.cos(a);
    gsap.set('#cv' + i, { left: 540 - 125 + Math.sin(a) * 360, top: 1300 - 125 + Math.sin(a * 2 + i) * 40 - z * 150, scale: .55 + .35 * (1 - z) / 2 + .15, zIndex: z > 0 ? 0 : 0, autoAlpha: .25 + .6 * (1 - z) / 2, rotation: Math.sin(a) * 8 });
  });
  // Égaliseur
  if (t > 22 && t < 26.5) $$('#eq i').forEach((b, i) => gsap.set(b, { height: 14 + 100 * Math.abs(Math.sin(t * 6.283 * 1 + i * .7) * Math.sin(t * 3.1 + i * 1.9)) }));
  // Bulles « Je prie »
  if (t > 26 && t < 32.5) for (let i = 0; i < 9; i++) {
    const d = 27 + i * .45, p = (t - d) / 3.2;
    const el = '#bu' + i;
    if (p < 0 || p > 1) { gsap.set(el, { autoAlpha: 0 }); continue; }
    gsap.set(el, { left: 40 + rnd(i) * 780, top: 1860 - p * 1000, autoAlpha: p < .15 ? p / .15 : p > .75 ? (1 - p) / .25 : 1, scale: .8 + rnd(i + 3) * .4, x: Math.sin(t * 2 + i) * 18 });
  }
  // Particules (repos)
  if (t > 36.5 && t < 41.5) for (let i = 0; i < 60; i++) {
    const v = 40 + rnd(i) * 70, y = (1920 + 40) - ((t * v + rnd(i + 9) * 2000) % 2000);
    gsap.set('#pa' + i, { left: rnd(i + 2) * 1080 + Math.sin(t * .8 + i) * 30, top: y, scale: .4 + rnd(i + 5) * 1.6, autoAlpha: .15 + .55 * rnd(i + 11) });
  }
}
window.DUREE = DUREE;
window.seek = (t) => { tl.seek(t, false); ambiance(t); };
window.pret = document.fonts.ready.then(() => Promise.all([...document.images].map((im) => im.decode().catch(() => {}))));
window.seek(0);
</script>
</body>
</html>
