        type: object
        fields:
          - { name: photos, label: "Photos des membres (bandeau vert flashy)", type: image, list: true }
          - { name: band, label: "Bande verte (mots, réserve)", type: string, list: true }
          - { name: outline, label: "Bande contour (mots)", type: string, list: true }
      - name: quickLinks
        label: "Tuiles « Commencer ici »"
        type: object
        fields:
          - { name: kicker, label: Sur-titre, type: string }
          - { name: title, label: Titre, type: string }
