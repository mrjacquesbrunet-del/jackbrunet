# Espace d'administration (Pages CMS — https://pagescms.org)
#
# Ouvre https://app.pagescms.org, connecte-toi avec GitHub, choisis ce dépôt :
# tout le contenu du site (textes, photos, vidéos, horaires, équipe,
# témoignages, dons…) se modifie dans des formulaires, sans toucher au code.
# Chaque « Save » publie automatiquement et garde un historique sur GitHub.

media:
  input: eglise-tout-est-possible-pau/public/uploads
  output: /uploads

content:
  - name: settings
    label: "⚙️ Paramètres du site"
    type: file
    path: eglise-tout-est-possible-pau/content/settings.json
    fields:
      - { name: name, label: Nom de l'église, type: string }
      - { name: city, label: Ville, type: string }
      - { name: shortName, label: Nom court, type: string }
      - { name: tagline, label: Slogan, type: string }
      - { name: description, label: Description (SEO / partage), type: text }
      - { name: url, label: URL du site, type: string }
      - { name: contactEmail, label: Email de contact, type: string }
      - { name: phone, label: Téléphone, type: string }
      - { name: whatsapp, label: WhatsApp (lien), type: string }
      - name: address
        label: Adresse
        type: object
        fields:
          - { name: venue, label: Nom du lieu, type: string }
          - { name: street, label: Rue, type: string }
          - { name: postalCode, label: Code postal, type: string }
          - { name: city, label: Ville, type: string }
          - { name: mapUrl, label: Lien Google Maps, type: string }
      - name: social
        label: Réseaux sociaux
        type: object
        fields:
          - { name: youtube, label: YouTube (URL), type: string }
          - { name: instagram, label: Instagram (URL), type: string }
          - { name: facebook, label: Facebook (URL), type: string }
          - { name: tiktok, label: TikTok (URL), type: string }
      - name: youtube
        label: Chaîne YouTube (import automatique)
        type: object
        fields:
          - { name: handle, label: "Identifiant (ex. @monEglise)", type: string }
          - { name: channelUrl, label: URL de la chaîne, type: string }
          - { name: channelId, label: "ID de chaîne (optionnel)", type: string }
      - name: helloasso
        label: Dons HelloAsso
        type: object
        fields:
          - { name: url, label: Page de don HelloAsso (URL), type: string }
          - { name: widgetUrl, label: "Widget intégré (URL, optionnel)", type: string }
      - name: hero
        label: Vidéo d'accueil
        type: object
        fields:
          - { name: videoUrl, label: "Vidéo plein écran (URL .mp4)", type: string }
          - { name: posterImage, label: "Image d'attente (poster)", type: image }
      - name: newsletter
        label: Annonces par e-mail
        type: object
        fields:
          - { name: formAction, label: "URL du formulaire d'inscription (Brevo/Mailchimp)", type: string }

