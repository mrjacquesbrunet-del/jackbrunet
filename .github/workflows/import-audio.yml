name: Importer des audios (liens temporaires)

# Télécharge des MP3 depuis des liens temporaires (ex. Magnific) et les range
# dans public/audio/<dossier>/ sous les noms voulus. Le site (jackbrunet.com)
# les sert ensuite à l'app, comme l'audio des méditations.
# Entrée « fichiers » : une ligne par fichier, au format  nom.mp3|https://lien
on:
  workflow_dispatch:
    inputs:
      dossier:
        description: "Sous-dossier de public/audio (ex. etudes)"
        required: true
        default: etudes
      fichiers:
        description: "Lignes « nom.mp3|url » (vide : seulement recompresser le dossier)"
        required: false

permissions:
  contents: write

concurrency:
  group: import-audio
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/great-hamilton-ieokug

      - name: Télécharger
        env:
          DOSSIER: ${{ inputs.dossier }}
          FICHIERS: ${{ inputs.fichiers }}
        run: |
          case "$DOSSIER" in *..*|/*|"") echo "Dossier invalide"; exit 1;; esac
          mkdir -p "public/audio/$DOSSIER"
          echo "$FICHIERS" | tr ' ' '\n' | while IFS='|' read -r nom url; do
            [ -z "$nom" ] && continue
            case "$nom" in *.mp3) ;; *) echo "Nom invalide: $nom"; exit 1;; esac
            case "$nom" in */*|*..*) echo "Nom invalide: $nom"; exit 1;; esac
            # Un audio long peut arriver en plusieurs parties : « nom.mp3|url1,url2 »
            # (dans l'ordre) ; elles sont mises bout à bout.
            if echo "$url" | grep -q ','; then
              command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
              tmp=$(mktemp -d); k=0; : > "$tmp/liste.txt"
              for u in $(echo "$url" | tr ',' ' '); do
                k=$((k+1)); curl -fsSL --retry 3 -o "$tmp/p$k.mp3" "$u"
                echo "file '$tmp/p$k.mp3'" >> "$tmp/liste.txt"
              done
              ffmpeg -nostdin -y -loglevel error -f concat -safe 0 -i "$tmp/liste.txt" -ac 1 -ar 44100 -b:a 48k "public/audio/$DOSSIER/$nom"
              rm -rf "$tmp"
            else
              curl -fsSL --retry 3 -o "public/audio/$DOSSIER/$nom" "$url"
            fi
            taille=$(stat -c %s "public/audio/$DOSSIER/$nom")
            type=$(file -b --mime-type "public/audio/$DOSSIER/$nom")
            echo "$nom : $taille octets ($type)"
            [ "$taille" -gt 10000 ] || { echo "Fichier trop petit: $nom"; exit 1; }
          done

      - name: Compresser (voix, mono 48 kbit/s)
        env:
          DOSSIER: ${{ inputs.dossier }}
        run: |
          # Le site (GitHub Pages) est limité à ~1 Go : les voix sont compressées
          # comme la Bible audio (mono, 48 kbit/s), sans perte audible.
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          for f in public/audio/"$DOSSIER"/*.mp3; do
            br=$(ffprobe -v error -select_streams a:0 -show_entries stream=bit_rate,channels -of csv=p=0 "$f" | head -1)
            debit=${br%%,*}; canaux=${br##*,}
            if [ "${debit:-0}" -gt 56000 ] || [ "${canaux:-1}" -gt 1 ]; then
              ffmpeg -nostdin -y -loglevel error -i "$f" -ac 1 -ar 44100 -b:a 48k "$f.tmp.mp3" && mv "$f.tmp.mp3" "$f"
            fi
          done
          du -sh "public/audio/$DOSSIER"

      - name: Liste des audios du dossier (index.json)
        env:
          DOSSIER: ${{ inputs.dossier }}
        run: |
          # L'app lit cette liste pour savoir quels audios traduits existent
          # (dossiers en/ et pt/ : méditations, plans, formation, études).
          ls "public/audio/$DOSSIER" | grep -i '\.mp3$' | sort | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.stringify(s.split("\n").filter(Boolean))))' > "public/audio/$DOSSIER/index.json"
          echo "$(node -e 'console.log(require("./public/audio/'"$DOSSIER"'/index.json").length)') fichiers dans $DOSSIER"

      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/audio
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git commit -m "chore(audio): import ${{ inputs.dossier }} [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin claude/great-hamilton-ieokug && git push origin "HEAD:claude/great-hamilton-ieokug" && break
            sleep $((2**i))
          done
