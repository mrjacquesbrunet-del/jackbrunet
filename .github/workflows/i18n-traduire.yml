name: Multilingue — traduire l'interface (Claude)

# Traduit les textes relevés dans i18n/source-fr.json en anglais et en
# portugais du Brésil (API Anthropic, Message Batches : moitié prix) et
# enregistre public/i18n/ui.<langue>.json. Reprenable : relancer récupère
# les lots en cours et ne traduit que les nouveaux textes.
# Prérequis : secret ANTHROPIC_API_KEY dans le dépôt.

on:
  workflow_dispatch:
    inputs:
      langues:
        description: 'Langues (ex. "en,pt")'
        required: false
        default: "en,pt"
      modele:
        description: "Modèle Claude"
        required: false
        default: "claude-opus-5-5"
      limite:
        description: "Nombre maximum de textes par langue (essai ; 0 = tout)"
        required: false
        default: "0"
      refaire:
        description: "Tout retraduire (1 = oui)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: i18n-traduire
  cancel-in-progress: false

jobs:
  traduire:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Identité git (sauvegardes du robot)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Relever les textes (au cas où le code a changé)
        run: node scripts/i18n/extraire-textes.mjs

      - name: Traduire (lots Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELE: ${{ inputs.modele || 'claude-opus-5-5' }}
          LANGUES: ${{ inputs.langues || 'en,pt' }}
          LIMITE: ${{ inputs.limite || '0' }}
          REFAIRE: ${{ inputs.refaire || '0' }}
        run: node scripts/i18n/traduire-ui.mjs
