name: Générer les commentaires (OpenAI)

# AUTONOME : un planning GitHub (toutes les 3 h) relance la génération côté
# serveur — aucune intervention nécessaire. Chaque exécution ne génère QUE les
# versets manquants (reprise) et s'arrête d'elle-même quand tout est complet.
# Lancement manuel possible aussi (bouton « Run workflow »).

on:
  schedule:
    - cron: "17 */3 * * *" # toutes les 3 heures (heure UTC)
  workflow_dispatch:
    inputs:
      books:
        description: 'Livres à générer (ex: "43" pour Jean, "40,41,42,43", vide = toute la Bible)'
        required: false
        default: ""
      model:
        description: "Modèle OpenAI"
        required: false
        default: "gpt-4o-mini"
      limit:
        description: "Limite de versets (0 = illimité)"
        required: false
        default: "0"

permissions:
  contents: write

# Jamais deux générations en même temps (évite les conflits git) : une nouvelle
# attend que la précédente finisse.
concurrency:
  group: commentary-generation
  cancel-in-progress: false

jobs:
  commentary:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Générer les commentaires
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model }}
          BOOKS: ${{ inputs.books }}
          LIMIT: ${{ inputs.limit }}
          CONCURRENCY: "5"
        run: node scripts/generate-commentary.mjs

      - name: Commiter le reste (sécurité)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/commentary || true
          if git diff --staged --quiet; then
            echo "Rien à commiter (déjà sauvegardé par livre)."
          else
            git commit -m "chore(commentary): génération (OpenAI) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi
