name: Générer l'audio (ElevenLabs)

# Lancement MANUEL (bouton « Run workflow ») pour maîtriser les coûts.
# Génère les MP3 des dévotionnels avec la voix clonée, puis les commite.
# Ce commit déclenche ensuite le déploiement normal (deploy.yml).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer les fichiers audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: node scripts/generate-audio.mjs

      - name: Compresser les voix (mono, 48 kbit/s)
        run: |
          # jackbrunet.com (GitHub Pages) est limité à ~1 Go : les voix sont
          # compressées comme les audios anglais/portugais (mono, 48 kbit/s),
          # sans perte audible. La musique de soaking n'est pas touchée.
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          for f in public/audio/*.mp3; do
            case "$f" in *soaking*) continue;; esac
            br=$(ffprobe -v error -select_streams a:0 -show_entries stream=bit_rate,channels -of csv=p=0 "$f" | head -1)
            debit=${br%%,*}; canaux=${br##*,}
            if [ "${debit:-0}" -gt 56000 ] || [ "${canaux:-1}" -gt 1 ]; then
              ffmpeg -nostdin -y -loglevel error -i "$f" -ac 1 -ar 44100 -b:a 48k "$f.tmp.mp3" && mv "$f.tmp.mp3" "$f"
            fi
          done
          du -sh public/audio --exclude=en --exclude=pt

      - name: Commiter les nouveaux audios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/audio content/audio.generated.json
          if git diff --staged --quiet; then
            echo "Aucun nouvel audio à commiter."
          else
            git commit -m "chore(audio): génération des MP3 (ElevenLabs) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi
